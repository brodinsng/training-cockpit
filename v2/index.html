<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Cyprus</title>
<link rel="manifest" href="/v2/manifest.webmanifest">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#262d36;
    --ink:#e6edf3; --mut:#8b949e; --dim:#6e7681;
    --accent:#6f8fb0; --good:#57a773; --warn:#d0954a; --bad:#c96b6b;
    --bike:#6f8fb0; --swim:#5aa6c0; --run:#c98f6b; --rest:#6e7681;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{max-width:640px; margin:0 auto; padding:0 16px calc(88px + env(safe-area-inset-bottom))}
  header.top{display:flex; align-items:baseline; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 2px 10px}
  header.top h1{font-size:19px; font-weight:600; letter-spacing:.5px; margin:0}
  header.top .sub{color:var(--dim); font-size:12px}
  .view{display:none; animation:f .18s ease}
  .view.on{display:block}
  @keyframes f{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; margin:0 0 12px}
  .card h2{font-size:12px; font-weight:600; letter-spacing:.8px; text-transform:uppercase;
    color:var(--mut); margin:0 0 12px}
  .big{font-size:34px; font-weight:650; line-height:1.05; letter-spacing:-.5px}
  .row{display:flex; gap:12px}
  .metric{flex:1; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:12px}
  .metric .k{color:var(--dim); font-size:11px; letter-spacing:.5px; text-transform:uppercase}
  .metric .v{font-size:24px; font-weight:600; margin-top:2px}
  .verdict{font-size:15px; margin-top:8px; color:var(--ink)}
  .lede{color:var(--mut); font-size:13.5px; margin:2px 0 0}
  .tag{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.4px;
    padding:3px 8px; border-radius:999px; border:1px solid var(--line)}
  .t-good{color:var(--good); border-color:#2b5138}
  .t-warn{color:var(--warn); border-color:#5a4526}
  .t-bad{color:var(--bad); border-color:#5a2f2f}
  .sess{display:flex; align-items:center; padding:11px 0; border-bottom:1px solid var(--line)}
  .sess:last-child{border-bottom:0}
  .sess .d{color:var(--dim); font-size:12px; width:38px; flex:none}
  .sess .dot{width:8px; height:8px; border-radius:50%; margin:0 10px 0 0; flex:none}
  .sess .m{flex:1}
  .sess .m b{font-weight:600} .sess .m span{color:var(--dim); font-size:12px; display:block}
  .sess .lk{color:var(--dim); font-size:10px; letter-spacing:.5px; text-transform:uppercase; flex:none}
  .flag{background:linear-gradient(180deg,#1c232c,#161b22); border-color:#3a2f22}
  .flag h2{color:var(--warn)}
  .btn{display:inline-block; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer}
  .btn:active{opacity:.7}
  .btn.acc{background:var(--accent); border-color:var(--accent); color:#0d1117}
  input,textarea{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:11px; font:inherit; margin:0 0 10px}
  textarea{min-height:64px; resize:vertical}
  .msg{padding:10px 12px; border-radius:10px; margin:0 0 8px; font-size:14px}
  .msg.u{background:var(--panel2); border:1px solid var(--line)}
  .msg.a{background:#141c26; border:1px solid #24344a}
  .msg.a b{color:var(--accent)}
  nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; justify-content:space-around; gap:2px;
    background:rgba(13,17,23,.92); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1; background:none; border:0; color:var(--dim);
    font-size:10.5px; letter-spacing:.3px; padding:6px 2px; cursor:pointer}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button .ic{display:block; font-size:16px; margin-bottom:3px; font-weight:600}
  .load{color:var(--dim); text-align:center; padding:40px 0; font-size:13px}
  .spark{display:flex; align-items:flex-end; gap:3px; height:44px; margin-top:10px}
  .spark i{flex:1; background:var(--accent); opacity:.5; border-radius:2px 2px 0 0; min-height:2px}
  .spark i.today{opacity:1}
  .cd{font-size:22px; font-weight:650; letter-spacing:-.3px}
  .muted{color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><h1>CYPRUS</h1><div class="sub" id="sub">loading…</div></div>
    <div class="tag" id="hdrTag">—</div>
  </header>

  <section class="view on" id="v-today"><div class="load">Reading your training…</div></section>
  <section class="view" id="v-fitness"></section>
  <section class="view" id="v-schedule"></section>
  <section class="view" id="v-fuel"></section>
  <section class="view" id="v-coach"></section>
  <section class="view" id="v-races"></section>
</div>

<nav class="tabs" id="tabs">
  <button data-v="today" class="on"><span class="ic">▲</span>Today</button>
  <button data-v="fitness"><span class="ic">◆</span>Fitness</button>
  <button data-v="schedule"><span class="ic">▤</span>Schedule</button>
  <button data-v="fuel"><span class="ic">◈</span>Fuel</button>
  <button data-v="coach"><span class="ic">◇</span>Coach</button>
  <button data-v="races"><span class="ic">⚑</span>Races</button>
</nav>

<script>
/* ================= Cyprus v2 =================
   One clean codebase. Reuses existing backend:
   /api/me, /api/u/activities, /api/u/events, /api/u/ai
   Auto-derives everything it can from Strava.
=============================================== */
const ZONES = { hr:[127,158,174,189], ftp:199, runPace:[2.83,3.288,3.662,3.912,4.162], weight:65, fivek:'21:11' };
// Fixed weekly anchors (0=Sun..6=Sat) — his real constraints
const FIXED = { 3:{sport:'Bike',label:'FIVE45'}, 5:{sport:'Bike',label:'FIVE45'}, 6:{sport:'Bike',label:'FIVE45'}, 0:{sport:'Bike',label:'CCP'} };
const S = { me:null, acts:[], events:[], fit:null, week:null, view:'today', ready:false, chat:[] };

const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const mins = s => Math.round(s/60);
const fmtPace = mps => { if(!mps) return '—'; const s=1000/mps; return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')+'/km'; };
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SPORTCOL={Bike:'var(--bike)',Swim:'var(--swim)',Run:'var(--run)',Rest:'var(--rest)'};

async function getJSON(u){ const r=await fetch(u,{credentials:'include'}); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }
async function postAI(message){ const r=await fetch('/api/u/ai',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})}); const j=await r.json(); return j.reply||j.message||'(no reply)'; }

/* ---- Fitness: CTL/ATL/TSB from real load ---- */
function computeFitness(acts){
  const today=new Date(); today.setHours(0,0,0,0); const day0=today.getTime();
  const load={};
  acts.forEach(a=>{
    const d=new Date(a.start_local||a.start_date_local||a.start_date); d.setHours(0,0,0,0);
    const idx=Math.round((d.getTime()-day0)/864e5);
    if(idx>-60 && idx<=0){ const l=(a.summary&&a.summary.relative_effort)||a.relative_effort||0; load[idx]=(load[idx]||0)+l; }
  });
  const kC=2/(42+1), kA=2/(7+1); let ctl=0, atl=0;
  for(let i=-59;i<=0;i++){ const l=load[i]||0; ctl=ctl+kC*(l-ctl); atl=atl+kA*(l-atl); }
  const spark=[]; for(let i=-13;i<=0;i++) spark.push(load[i]||0);
  // 7-day trend of CTL for ramp
  let ctl7=0; for(let i=-59;i<=-7;i++){ const l=load[i]||0; ctl7=ctl7+kC*(l-ctl7); }
  return { ctl:Math.round(ctl), atl:Math.round(atl), tsb:Math.round(ctl-atl), spark, ramp:Math.round(ctl-ctl7) };
}
function readiness(f){
  const t=f.tsb;
  if(t<=-20) return {tag:'Overreached', cls:'t-bad', line:'Deep fatigue. Today is recovery or rest — not a day to add load.'};
  if(t<=-8)  return {tag:'Fatigued', cls:'t-warn', line:'Carrying real load. Keep today easy; save intensity for when form recovers.'};
  if(t<5)    return {tag:'Neutral', cls:'', line:'Balanced. Train as planned; let the session dictate effort.'};
  if(t<15)   return {tag:'Fresh', cls:'t-good', line:'Recovered and ready. Good window for a quality or key session.'};
  return {tag:'Very fresh', cls:'t-good', line:'Well rested — if anything under-trained. Push the key session.'};
}
function limiterWatch(acts){
  const now=Date.now();
  const swims=acts.filter(a=>{ const st=(a.sport_type||a.type||'').toLowerCase(); const d=new Date(a.start_local||a.start_date_local); return st.includes('swim') && (now-d.getTime())<21*864e5; });
  if(swims.length===0) return {line:'No swim logged in 3 weeks. Swim is your limiter — one session this week protects it.'};
  return null;
}

/* ---- Adaptive week: honors fixed anchors, inserts limiter + recovery ---- */
function buildWeek(fit){
  const out=[]; const today=new Date(); today.setHours(0,0,0,0);
  const fatigued = fit.tsb<=-8; let swimPlaced=false, runPlaced=false;
  for(let i=0;i<7;i++){
    const d=new Date(today.getTime()+i*864e5); const dow=d.getDay();
    if(FIXED[dow]){ out.push({d,dow,sport:FIXED[dow].sport,label:FIXED[dow].label,fixed:true,note:'Locked'}); continue; }
    if(dow===1){ out.push({d,dow,sport:'Rest',label:'Recovery',fixed:false,note:'Post-weekend — let the legs come back'}); continue; }
    if(!swimPlaced){ swimPlaced=true; out.push({d,dow,sport:'Swim',label:'Technique + aerobic',fixed:false,note:'Your limiter — protect this slot'}); continue; }
    if(!runPlaced && !fatigued){ runPlaced=true; out.push({d,dow,sport:'Run',label:'Easy aerobic Z2',fixed:false,note:'Keep it conversational'}); continue; }
    out.push({d,dow,sport:'Rest',label:fatigued?'Rest':'Optional easy',fixed:false,note:fatigued?'Form is low — recover':'Add only if fresh'});
  }
  return out;
}
function todaySession(){ return (S.week||[]).find(x=>x.dow===new Date().getDay()); }

/* ---- Coach context (injected into every message) ---- */
function coachContext(){
  const f=S.fit;
  const recent=S.acts.slice(0,6).map(a=>(a.sport_type||'?')+' RE'+((a.summary&&a.summary.relative_effort)||0)).join(', ');
  return 'MY LIVE DATA — Fitness/CTL '+f.ctl+', Fatigue/ATL '+f.atl+', Form/TSB '+f.tsb+' ('+readiness(f).tag+'), 6-wk ramp '+(f.ramp>=0?'+':'')+f.ramp+'. '
    +'Zones: HR Z2 128-158 Z4 175-189, FTP 199W, threshold pace '+fmtPace(ZONES.runPace[3])+', 5k ~'+ZONES.fivek+', 65kg. '
    +'Limiter: SWIM (weak link). Fixed sessions: Wed/Fri/Sat FIVE45 bike, Sun CCP bike — never move these. '
    +'Recent: '+recent+'. Answer as my coach using THIS data; be specific and brief.';
}

/* ---------- Views ---------- */
function renderToday(){
  const v=$('#v-today'); v.innerHTML=''; const f=S.fit, r=readiness(f);
  const c1=el('div','card'); c1.append(el('h2',null,'Readiness · today'));
  const top=el('div','row'); top.style.alignItems='baseline'; top.style.justifyContent='space-between';
  top.append(el('div','big',r.tag)); top.append(el('div','tag '+r.cls,'Form '+(f.tsb>=0?'+':'')+f.tsb));
  c1.append(top); c1.append(el('div','verdict',r.line)); v.append(c1);

  const ts=todaySession();
  if(ts){ const c=el('div','card'); c.append(el('h2',null,'Today’s session'));
    const s=el('div','sess'); const dot=el('div','dot'); dot.style.background=SPORTCOL[ts.sport]||'var(--dim)'; s.append(dot);
    const m=el('div','m'); m.innerHTML='<b>'+ts.sport+(ts.label?' · '+ts.label:'')+'</b><span>'+ts.note+'</span>'; s.append(m);
    if(ts.fixed) s.append(el('div','lk','locked'));
    c.append(s); v.append(c);
  }

  const lim=limiterWatch(S.acts);
  if(lim){ const fc=el('div','card flag'); fc.append(el('h2',null,'Limiter watch')); fc.append(el('div','lede',lim.line)); v.append(fc); }

  const last=S.acts[0];
  if(last){ const c2=el('div','card'); c2.append(el('h2',null,'Last session')); const su=last.summary||{};
    c2.append(el('div','verdict','<b>'+last.name+'</b>'));
    c2.append(el('div','lede',(su.distance?(su.distance/1000).toFixed(1)+' km · ':'')+(su.moving_time?mins(su.moving_time)+' min · ':'')+'RE '+(su.relative_effort||'—')));
    v.append(c2);
  }
}
function renderFitness(){
  const v=$('#v-fitness'); v.innerHTML=''; const f=S.fit;
  const c=el('div','card'); c.append(el('h2',null,'Fitness'));
  const row=el('div','row');
  [['Fitness',f.ctl],['Fatigue',f.atl],['Form',(f.tsb>=0?'+':'')+f.tsb]].forEach(m=>{
    const mm=el('div','metric'); mm.append(el('div','k',m[0])); mm.append(el('div','v',m[1])); row.append(mm);
  });
  c.append(row);
  const sp=el('div','spark'); const max=Math.max(1,...f.spark);
  f.spark.forEach((l,i)=>{const b=el('i'); b.style.height=(6+l/max*38)+'px'; if(i===f.spark.length-1)b.className='today'; sp.append(b);});
  c.append(sp);
  c.append(el('div','lede','14-day load. Fitness (CTL) is your rolling 42-day load; Form (TSB) is fitness minus fatigue. 6-week trend: '+(f.ramp>=0?'building +':'easing ')+f.ramp+'.'));
  v.append(c);
  const z=el('div','card'); z.append(el('h2',null,'Your zones (from Strava)'));
  z.append(el('div','lede','HR Z2 128–158 · Z4 175–189 · FTP '+ZONES.ftp+'W · threshold pace '+fmtPace(ZONES.runPace[3])+' · 5k ~'+ZONES.fivek));
  v.append(z);
}
function renderSchedule(){
  const v=$('#v-schedule'); v.innerHTML='';
  const c=el('div','card'); c.append(el('h2',null,'Adaptive week'));
  (S.week||[]).forEach(x=>{
    const s=el('div','sess'); s.append(el('div','d',DAY[x.dow]));
    const dot=el('div','dot'); dot.style.background=SPORTCOL[x.sport]||'var(--dim)'; s.append(dot);
    const m=el('div','m'); m.innerHTML='<b>'+x.sport+(x.label?' · '+x.label:'')+'</b><span>'+x.note+'</span>'; s.append(m);
    if(x.fixed) s.append(el('div','lk','locked'));
    c.append(s);
  });
  v.append(c);
  const info=el('div','card'); info.append(el('h2',null,'How this is built'));
  info.append(el('div','lede','Wed / Fri / Sat FIVE45 and Sun CCP are locked and never moved. The open days fill around them — a swim first (your limiter), then easy aerobic, with rest that flexes to your current form.'));
  v.append(info);

  // calendar this week (real events)
  const now=new Date(); now.setHours(0,0,0,0); const end=now.getTime()+8*864e5;
  const evs=(S.events||[]).map(e=>({e,d:new Date((e.start&&(e.start.dateTime||e.start.date))||Date.now())}))
    .filter(x=>x.d.getTime()>=now.getTime()&&x.d.getTime()<=end).sort((a,b)=>a.d-b.d).slice(0,12);
  if(evs.length){ const cc=el('div','card'); cc.append(el('h2',null,'On your calendar'));
    evs.forEach(x=>{ const s=el('div','sess'); s.append(el('div','d',DAY[x.d.getDay()]));
      const m=el('div','m'); const tm=(x.d.getHours()||x.d.getMinutes())?String(x.d.getHours()).padStart(2,'0')+':'+String(x.d.getMinutes()).padStart(2,'0'):'';
      m.innerHTML='<b>'+(x.e.summary||'Event')+'</b>'+(tm?'<span>'+tm+'</span>':''); s.append(m); cc.append(s);
    });
    v.append(cc);
  }
}
function renderFuel(){
  const v=$('#v-fuel'); v.innerHTML=''; const h=new Date().getHours();
  const meal=h<10?'Breakfast':h<15?'Lunch':h<20?'Dinner':'Evening';
  const f=S.fit, ts=todaySession(); const hardDay = ts && (ts.sport==='Bike'||ts.sport==='Run') && ts.fixed;
  const highLoad = f.atl>f.ctl+3;
  const c=el('div','card'); c.append(el('h2',null,meal+' · recovery-aware'));
  let msg;
  if(hardDay && (meal==='Breakfast'||meal==='Lunch')) msg='Key '+ts.sport.toLowerCase()+' today ('+ts.label+'). Front-load carbs now — oats, rice, fruit — so you hit the session fuelled. Protein ~'+Math.round(ZONES.weight*1.6)+'g across the day.';
  else if(hardDay) msg='Post-'+ts.sport.toLowerCase()+' recovery window. Protein + carbs within the hour to refill glycogen; aim ~'+Math.round(ZONES.weight*1.6)+'g protein total today.';
  else if(highLoad) msg='Load is high right now — protein + carbs to recover. ~'+Math.round(ZONES.weight*1.6)+'g protein today; don’t under-fuel dinner.';
  else msg='Lighter day ('+(ts?ts.sport.toLowerCase():'easy')+'). Balanced plate — protein ~'+Math.round(ZONES.weight*1.4)+'g, carbs matched to tomorrow’s session.';
  c.append(el('div','verdict',msg));
  c.append(el('div','lede','Cross-referenced to today’s session and your current fatigue.'));
  v.append(c);
}
function renderCoach(){
  const v=$('#v-coach'); v.innerHTML='';
  const c=el('div','card'); c.append(el('h2',null,'Coach'));
  const log=el('div',null); log.id='chatlog';
  if(!S.chat.length) log.append(el('div','lede','Ask anything — training, pacing, recovery, race prep. It answers with your live zones, load and limiter in context.'));
  S.chat.forEach(m=>{ const d=el('div','msg '+(m.role==='u'?'u':'a')); d.innerHTML=(m.role==='u'?'':'<b>Coach</b> ')+m.text; log.append(d); });
  c.append(log);
  const ta=el('textarea'); ta.id='coachIn'; ta.placeholder='e.g. Should I swim tomorrow or add a bike?';
  c.append(ta);
  const b=el('button','btn acc','Ask coach'); b.id='coachBtn';
  c.append(b); v.append(c);
  b.addEventListener('click', sendCoach);
}
async function sendCoach(){
  const ta=$('#coachIn'), b=$('#coachBtn'); const q=(ta.value||'').trim(); if(!q) return;
  S.chat.push({role:'u',text:q}); b.textContent='Thinking…'; b.disabled=true;
  renderCoach();
  try{ const reply=await postAI(q+' ### '+coachContext()); S.chat.push({role:'a',text:reply}); }
  catch(e){ S.chat.push({role:'a',text:'Could not reach the coach just now. Try again in a moment.'}); }
  renderCoach();
}
function getRaces(){ try{return JSON.parse(localStorage.getItem('cy_races')||'[]')}catch(e){return[]} }
function saveRaces(r){ try{localStorage.setItem('cy_races',JSON.stringify(r))}catch(e){} }
function renderRaces(){
  const v=$('#v-races'); v.innerHTML=''; const races=getRaces().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const now=new Date(); now.setHours(0,0,0,0);
  const c=el('div','card'); c.append(el('h2',null,'Races & goals'));
  if(!races.length) c.append(el('div','lede','No races yet. Add your next one below and Cyprus tracks the countdown and whether your fitness is trending where it needs to be.'));
  races.forEach((rc,i)=>{
    const d=new Date(rc.date); const days=Math.ceil((d-now)/864e5); const wks=(days/7);
    const s=el('div','sess'); const m=el('div','m');
    const status = days<0?'done':(S.fit.ramp>=0?'on track — fitness building':'fitness easing — watch the ramp');
    m.innerHTML='<b>'+rc.name+'</b><span>'+d.toDateString().slice(4)+' · '+status+'</span>'; s.append(m);
    s.append(el('div','cd',days<0?'—':days+'d'));
    c.append(s);
  });
  v.append(c);
  const add=el('div','card'); add.append(el('h2',null,'Add a race'));
  const ni=el('input'); ni.id='rcName'; ni.placeholder='Race name (e.g. IRONMAN 70.3 Geelong)';
  const di=el('input'); di.id='rcDate'; di.type='date';
  add.append(ni); add.append(di);
  const b=el('button','btn acc','Add race'); add.append(b); v.append(add);
  b.addEventListener('click',()=>{ const n=$('#rcName').value.trim(), dt=$('#rcDate').value; if(!n||!dt) return; const r=getRaces(); r.push({name:n,date:dt}); saveRaces(r); renderRaces(); });
}
const RENDER={today:renderToday,fitness:renderFitness,schedule:renderSchedule,fuel:renderFuel,coach:renderCoach,races:renderRaces};

function show(view){
  S.view=view;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  $('#v-'+view).classList.add('on');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(S.ready) RENDER[view]();
  try{localStorage.setItem('cy_view',view)}catch(e){}
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) show(b.dataset.v);});

/* swipe nav (ignore inputs) */
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(/INPUT|TEXTAREA/.test((e.target.tagName||''))) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)) return;
  const order=['today','fitness','schedule','fuel','coach','races'];
  let i=order.indexOf(S.view); i+= dx<0?1:-1;
  if(i>=0&&i<order.length) show(order[i]);
},{passive:true});

/* ---------- connect gate ---------- */
function renderConnect(me){
  document.getElementById('tabs').style.display='none';
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  const v=$('#v-today'); v.classList.add('on');
  $('#sub').textContent='Connect to begin'; $('#hdrTag').textContent=''; $('#hdrTag').className='tag';
  const strava = me && me.strava, google = me && me.google;
  const row=(ok,label,href,sub)=> ok
    ? '<div class="sess"><div class="m"><b>'+label+'</b><span>'+sub+'</span></div><div class="tag t-good">Connected</div></div>'
    : '<div class="sess"><div class="m"><b>'+label+'</b><span>'+sub+'</span></div><a class="btn acc" href="'+href+'">Connect</a></div>';
  v.innerHTML=
    '<div class="card"><h2>Welcome to Cyprus</h2><div class="lede">Cyprus reads your training from Strava and your schedule from Google Calendar, then builds your adaptive week, recovery fuel and coaching around your real data. Connect both to begin.</div></div>'
    +'<div class="card"><h2>Your accounts</h2>'
    + row(strava,'Strava','/api/auth/strava?return=%2Fv2%2F','Activities, load and zones')
    + row(google,'Google Calendar','/api/auth/google?return=%2Fv2%2F','Your sessions and schedule')
    + '</div>'
    + ((strava&&google)?'<div class="card"><a class="btn acc" href="/v2/" style="width:100%;text-align:center">Enter Cyprus</a></div>':'');
}

/* ---------- boot ---------- */
async function boot(){
  let me=null; try{ me=await getJSON('/api/me'); }catch(e){}
  if(!me || !me.strava || !me.google){ renderConnect(me); return; }
  try{
    const [actsR,evR]=await Promise.all([
      getJSON('/api/u/activities').catch(()=>({activities:[]})),
      getJSON('/api/u/events').catch(()=>({events:[]}))
    ]);
    S.me=me; S.acts=(actsR.activities||actsR||[]); S.events=(evR.events||evR||[]);
    S.fit=computeFitness(S.acts); S.week=buildWeek(S.fit); S.ready=true;
    $('#sub').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
    const r=readiness(S.fit); $('#hdrTag').textContent=r.tag; $('#hdrTag').className='tag '+r.cls;
    let v='today'; try{v=localStorage.getItem('cy_view')||'today'}catch(e){}
    show(v);
  }catch(err){
    $('#v-today').innerHTML='<div class="load">Couldn’t load your data. Pull to refresh, or check you’re signed in.<br><br>'+err.message+'</div>';
  }
}
boot();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/v2/sw.js').catch(()=>{}); }
</script>
